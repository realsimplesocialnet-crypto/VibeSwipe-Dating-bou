workflows:
  android-apk:
    name: Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: v20
      java: 17
      android_signing:
        - myagebeauty-release
      groups:
        - myage_build
      vars:
        PACKAGE_NAME: beauty.myage
        EXPO_PUBLIC_DOMAIN: myage.beauty
        EXPO_PUBLIC_WEB_URL: https://myage.beauty
    scripts:
      - name: Install dependencies
        script: |
          cd "$CM_BUILD_DIR"
          corepack enable
          corepack prepare pnpm@10.26.1 --activate
          pnpm --version
          pnpm install --frozen-lockfile
      - name: Check required app configuration
        script: |
          : "${EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY:?Add this variable to the myage_build group in Codemagic}"
      - name: Prebuild Android
        script: |
          pnpm --filter @workspace/vibeswipe exec expo prebuild --platform android --clean --non-interactive --no-install
      - name: Configure release signing
        script: |
          node "$CM_BUILD_DIR/artifacts/vibeswipe/scripts/configure-android-release.cjs"
      - name: Set Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/artifacts/vibeswipe/android/local.properties"
      - name: Check release signing
        script: |
          : "${CM_KEYSTORE_PATH:?Codemagic keystore myagebeauty-release was not loaded}"
          : "${CM_KEYSTORE_PASSWORD:?Codemagic keystore password was not loaded}"
          : "${CM_KEY_ALIAS:?Codemagic key alias was not loaded}"
          : "${CM_KEY_PASSWORD:?Codemagic key password was not loaded}"
      - name: Build release APK
        script: |
          cd "$CM_BUILD_DIR/artifacts/vibeswipe/android"
          ./gradlew assembleRelease
    artifacts:
      - artifacts/vibeswipe/android/app/build/outputs/apk/release/*.apk
