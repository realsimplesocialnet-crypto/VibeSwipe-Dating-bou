kind = "web"
previewPath = "/vibeswipe-web/"
title = "VibeSwipe Web"
description = "An installable browser version of VibeSwipe Dating that lets adults create profiles, discover people, match, and chat from Android Chrome and desktop browsers."
version = "1.0.0"
id = "artifacts/vibeswipe-web"
router = "path"

[[services]]
name = "web"
paths = [ "/vibeswipe-web/" ]
localPort = 20207

[services.development]
run = "pnpm --filter @workspace/vibeswipe-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vibeswipe-web", "run", "build" ]
serve = "static"
publicDir = "artifacts/vibeswipe-web/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20207"
BASE_PATH = "/vibeswipe-web/"
