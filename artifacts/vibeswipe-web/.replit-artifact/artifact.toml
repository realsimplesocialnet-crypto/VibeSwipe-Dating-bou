kind = "web"
previewPath = "/"
title = "VIBESWIPES"
description = "The VIBESWIPES public site and installable browser app for adults to create profiles, discover people, match, and chat."
version = "1.0.0"
id = "artifacts/vibeswipe-web"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20207

[services.development]
run = "pnpm --filter @workspace/vibeswipe-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vibeswipe-web", "run", "build" ]
serve = "static"
publicDir = "artifacts/vibeswipe-web/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20207"
BASE_PATH = "/"
