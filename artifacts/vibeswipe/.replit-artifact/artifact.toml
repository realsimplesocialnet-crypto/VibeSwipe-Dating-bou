kind = "mobile"
previewPath = "/vibeswipe-mobile/"
title = "MyAgeBeauty"
description = "MyAgeBeauty is a native social app for adults to share photos, Reels, Stories, follow people, message, and use safety controls."
version = "1.0.0"
id = "artifacts/vibeswipe"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/vibeswipe-mobile/" ]
localPort = 22375

[services.development]
run = "pnpm --filter @workspace/vibeswipe run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vibeswipe", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/vibeswipe", "run", "serve" ]

[services.env]
PORT = "22375"
BASE_PATH = "/vibeswipe-mobile/"
EXPO_PUBLIC_WEB_URL = "https://myage.beauty"
