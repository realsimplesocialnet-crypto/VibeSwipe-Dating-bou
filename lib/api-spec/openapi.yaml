openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: VibeSwipe dating profile, discovery, matching, messaging, and safety API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: vibeswipe
    description: Authenticated dating app operations
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /vibeswipe/me:
    get:
      operationId: getMyProfile
      tags: [vibeswipe]
      summary: Get the signed-in user's profile
      responses:
        "200":
          description: Profile found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          description: Profile has not been created
    put:
      operationId: saveMyProfile
      tags: [vibeswipe]
      summary: Create or update the signed-in user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Saved profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          description: Invalid profile
  /vibeswipe/discover:
    get:
      operationId: getDiscoverProfiles
      tags: [vibeswipe]
      summary: List profiles matching the signed-in user's preferences
      parameters:
        - in: query
          name: ageMin
          schema: { type: integer, minimum: 18, maximum: 120 }
        - in: query
          name: ageMax
          schema: { type: integer, minimum: 18, maximum: 120 }
        - in: query
          name: gender
          schema: { type: string }
        - in: query
          name: city
          schema: { type: string }
      responses:
        "200":
          description: Profiles for discovery
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Profile" }
  /vibeswipe/reactions:
    post:
      operationId: createReaction
      tags: [vibeswipe]
      summary: Like, super-like, or pass on a profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReactionInput"
      responses:
        "200":
          description: Reaction recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReactionResult"
        "404":
          description: Target profile not found
  /vibeswipe/matches:
    get:
      operationId: getMatches
      tags: [vibeswipe]
      summary: List current matches
      responses:
        "200":
          description: Matches for the signed-in user
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Match" }
  /vibeswipe/matches/{matchId}/messages:
    get:
      operationId: getMessages
      tags: [vibeswipe]
      summary: Get messages for a match
      parameters:
        - in: path
          name: matchId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Match messages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Message" }
        "403":
          description: Not a participant in the match
  /vibeswipe/matches/{matchId}/messages/{messageId}:
    delete:
      operationId: deleteMessage
      tags: [vibeswipe]
      summary: Delete a message for the signed-in user or for everyone
      parameters:
        - in: path
          name: matchId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: messageId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteMessageInput"
      responses:
        "204":
          description: Message deleted
        "403":
          description: Not allowed to delete this message
  /vibeswipe/matches/{matchId}:
    delete:
      operationId: unmatchMatch
      tags: [vibeswipe]
      summary: Remove a match and its shared chat history
      parameters:
        - in: path
          name: matchId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Match removed for both participants
        "403":
          description: Not a participant in the match
    post:
      operationId: sendMessage
      tags: [vibeswipe]
      summary: Send a message in a match
      parameters:
        - in: path
          name: matchId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "403":
          description: Not a participant in the match
  /vibeswipe/matches/{matchId}/messages/events:
    get:
      operationId: streamMatchMessages
      tags: [vibeswipe]
      summary: Stream new messages for a match
      description: Authenticated server-sent events stream. Reconnect with the most recent message ID in the Last-Event-ID header to recover missed messages.
      parameters:
        - in: path
          name: matchId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: Last-Event-ID
          required: false
          description: Most recently received message ID; messages after it are replayed on connection.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Server-sent message events
          content:
            text/event-stream:
              schema: { type: string }
        "403":
          description: Not a participant in the match
  /vibeswipe/matches/{matchId}/clear:
    post:
      operationId: clearChat
      tags: [vibeswipe]
      summary: Clear messages from the signed-in user's chat view
      parameters:
        - in: path
          name: matchId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Chat cleared for the signed-in user
        "403":
          description: Not a participant in the match
  /vibeswipe/matches/{matchId}/chat:
    delete:
      operationId: deleteChat
      tags: [vibeswipe]
      summary: Hide a conversation from the signed-in user's chat list
      parameters:
        - in: path
          name: matchId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Conversation hidden for the signed-in user
        "403":
          description: Not a participant in the match
  /vibeswipe/matches/{matchId}/typing:
    get:
      operationId: getTypingStatus
      tags: [vibeswipe]
      summary: Get the other participant's typing status
      parameters:
        - in: path
          name: matchId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Current typing status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypingStatus"
        "403":
          description: Not a participant in the match
    put:
      operationId: updateTypingStatus
      tags: [vibeswipe]
      summary: Update the signed-in user's temporary typing status
      parameters:
        - in: path
          name: matchId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TypingInput"
      responses:
        "204":
          description: Typing status updated
        "403":
          description: Chat is unavailable
  /vibeswipe/matches/{matchId}/theme:
    put:
      operationId: updateChatTheme
      tags: [vibeswipe]
      summary: Save the signed-in user's chat appearance for a match
      parameters:
        - in: path
          name: matchId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatThemeInput"
      responses:
        "200":
          description: Saved chat theme
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatThemeResult"
        "403":
          description: Chat is unavailable
  /vibeswipe/matches/{matchId}/uploads/request-url:
    post:
      operationId: requestChatMediaUpload
      tags: [vibeswipe]
      summary: Request a media upload URL for a matched chat
      parameters:
        - in: path
          name: matchId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaUploadInput"
      responses:
        "200":
          description: Private upload URL and media reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaUploadResult"
        "400":
          description: Invalid or oversized attachment
        "403":
          description: Chat is unavailable
  /vibeswipe/matches/{matchId}/presence:
    get:
      operationId: getMatchPresence
      tags: [vibeswipe]
      summary: Get the other participant's online and last-seen status
      parameters:
        - in: path
          name: matchId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Other participant's presence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresenceStatus"
        "403":
          description: Chat is unavailable
  /vibeswipe/matches/{matchId}/read:
    get:
      operationId: getChatReadReceipt
      tags: [vibeswipe]
      summary: Get when the other participant last read the chat
      parameters:
        - in: path
          name: matchId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Read receipt status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadReceiptStatus"
        "403":
          description: Chat is unavailable
    put:
      operationId: markChatRead
      tags: [vibeswipe]
      summary: Mark the chat read for the signed-in user
      parameters:
        - in: path
          name: matchId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Chat marked read
        "403":
          description: Chat is unavailable
  /vibeswipe/presence:
    put:
      operationId: heartbeatPresence
      tags: [vibeswipe]
      summary: Record that the signed-in user is active
      responses:
        "204":
          description: Presence updated
  /vibeswipe/profiles/{profileId}/views:
    post:
      operationId: recordProfileView
      tags: [vibeswipe]
      summary: Record that the signed-in user opened a profile
      parameters:
        - in: path
          name: profileId
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "204":
          description: Profile view recorded
        "404":
          description: Profile not found
  /vibeswipe/views:
    get:
      operationId: getWhoViewedYou
      tags: [vibeswipe]
      summary: List people who opened the signed-in user's profile
      responses:
        "200":
          description: Profile viewers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProfileView" }
  /vibeswipe/notifications:
    get:
      operationId: getNotifications
      tags: [vibeswipe]
      summary: List saved in-app notifications and unread tab counts
      responses:
        "200":
          description: Notifications for the signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationsResponse"
  /vibeswipe/notifications/{notificationId}/read:
    put:
      operationId: markNotificationRead
      tags: [vibeswipe]
      summary: Mark one notification as read
      parameters:
        - in: path
          name: notificationId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Notification marked read
        "404":
          description: Notification not found
  /vibeswipe/profiles/{profileId}:
    get:
      operationId: getProfileById
      tags: [vibeswipe]
      summary: Get a profile opened from a notification
      parameters:
        - in: path
          name: profileId
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Profile details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "403":
          description: Profile is unavailable
        "404":
          description: Profile not found
  /vibeswipe/blocks:
    get:
      operationId: getBlockedProfiles
      tags: [vibeswipe]
      summary: List profiles blocked by the signed-in user
      responses:
        "200":
          description: Blocked profiles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BlockedProfile" }
    post:
      operationId: blockProfile
      tags: [vibeswipe]
      summary: Block a profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockInput"
      responses:
        "204":
          description: Profile blocked
  /vibeswipe/blocks/{targetUserId}:
    delete:
      operationId: unblockProfile
      tags: [vibeswipe]
      summary: Unblock a profile blocked by the signed-in user
      parameters:
        - in: path
          name: targetUserId
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "204":
          description: Profile unblocked
  /vibeswipe/reports:
    post:
      operationId: reportProfile
      tags: [vibeswipe]
      summary: Report a profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "201":
          description: Report submitted
  /vibeswipe/uploads/request-url:
    post:
      operationId: requestProfileMediaUpload
      tags: [vibeswipe]
      summary: Request a protected profile media upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaUploadInput"
      responses:
        "200":
          description: Upload URL and media reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaUploadResult"
        "400":
          description: Unsupported media or invalid file size
  /vibeswipe/uploads/{mediaId}/transcode:
    post:
      operationId: transcodeProfileVideo
      tags: [vibeswipe]
      summary: Compress an uploaded profile video for playback
      parameters:
        - in: path
          name: mediaId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Compressed video metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileVideoTranscodeResult"
        "400":
          description: Video exceeds supported duration or size limits
        "404":
          description: Uploaded video was not found
        "500":
          description: Video could not be processed
  /vibeswipe/media/{mediaId}:
    get:
      operationId: getProfileMedia
      tags: [vibeswipe]
      summary: Stream a media file referenced by a profile
      parameters:
        - in: path
          name: mediaId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Protected media content
          content:
            "*/*":
              schema: { type: string, format: binary }
        "403":
          description: Media is not visible to the signed-in user
        "404":
          description: Media not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    ProfilePreferences:
      type: object
      properties:
        ageMin: { type: integer, minimum: 18, maximum: 120 }
        ageMax: { type: integer, minimum: 18, maximum: 120 }
        gender: { type: string }
        distanceKm: { type: integer, minimum: 1, maximum: 500 }
      required: [ageMin, ageMax, gender, distanceKm]
    Profile:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        age: { type: integer }
        gender: { type: string }
        lookingFor: { type: string }
        bio: { type: string }
        city: { type: string }
        interests:
          type: array
          items: { type: string }
        photos:
          type: array
          items: { type: string }
        videoUrl:
          type: [string, "null"]
        isDemo: { type: boolean }
        preferences:
          $ref: "#/components/schemas/ProfilePreferences"
      required: [id, name, age, gender, lookingFor, bio, city, interests, photos, isDemo, preferences]
    ProfileInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        age: { type: integer, minimum: 18, maximum: 120 }
        gender: { type: string, minLength: 1, maxLength: 40 }
        lookingFor: { type: string, minLength: 1, maxLength: 40 }
        bio: { type: string, maxLength: 500 }
        city: { type: string, maxLength: 100 }
        interests:
          type: array
          maxItems: 12
          items: { type: string, maxLength: 32 }
        photos:
          type: array
          minItems: 1
          maxItems: 6
          items: { type: string, maxLength: 2048 }
        videoUrl:
          type: [string, "null"]
          maxLength: 2048
        preferences:
          $ref: "#/components/schemas/ProfilePreferences"
      required: [name, age, gender, lookingFor, bio, city, interests, photos, preferences]
    ReactionInput:
      type: object
      properties:
        toUserId: { type: string, minLength: 1 }
        type: { type: string, enum: [like, super, pass] }
      required: [toUserId, type]
    ReactionResult:
      type: object
      properties:
        matched: { type: boolean }
        matchId:
          type: [string, "null"]
          format: uuid
      required: [matched]
    Match:
      type: object
      properties:
        id: { type: string, format: uuid }
        profile: { $ref: "#/components/schemas/Profile" }
        lastMessage:
          type: [string, "null"]
        updatedAt: { type: string, format: date-time }
        blockedByMe: { type: boolean }
        blockedMe: { type: boolean }
        chatTheme: { $ref: "#/components/schemas/ChatTheme" }
      required: [id, profile, updatedAt, blockedByMe, blockedMe, chatTheme]
    BlockedProfile:
      type: object
      properties:
        profile: { $ref: "#/components/schemas/Profile" }
        createdAt: { type: string, format: date-time }
      required: [profile, createdAt]
    TypingInput:
      type: object
      properties:
        isTyping: { type: boolean }
      required: [isTyping]
    TypingStatus:
      type: object
      properties:
        isTyping: { type: boolean }
      required: [isTyping]
    ChatTheme:
      type: string
      enum: [pink, blue, purple, green, dark, light]
    ChatThemeInput:
      type: object
      properties:
        theme: { $ref: "#/components/schemas/ChatTheme" }
      required: [theme]
    ChatThemeResult:
      type: object
      properties:
        theme: { $ref: "#/components/schemas/ChatTheme" }
      required: [theme]
    Message:
      type: object
      properties:
        id: { type: string, format: uuid }
        matchId: { type: string, format: uuid }
        senderId: { type: string }
        content: { type: string }
        createdAt: { type: string, format: date-time }
        mediaReference: { type: [string, "null"], maxLength: 100 }
        mediaType: { type: [string, "null"], enum: [image, video, audio, null] }
        mediaDuration: { type: [integer, "null"], minimum: 1, maximum: 60 }
        deletedForEveryone: { type: boolean }
        isRead: { type: boolean }
      required: [id, matchId, senderId, content, createdAt, deletedForEveryone, isRead]
    MessageInput:
      type: object
      properties:
        content: { type: string, minLength: 1, maxLength: 2000 }
        mediaReference: { type: string, minLength: 1, maxLength: 100 }
        mediaType: { type: string, enum: [image, video, audio] }
        mediaDuration: { type: integer, minimum: 1, maximum: 60 }
    DeleteMessageInput:
      type: object
      properties:
        forEveryone: { type: boolean }
      required: [forEveryone]
    PresenceStatus:
      type: object
      properties:
        isOnline: { type: boolean }
        lastSeenAt: { type: [string, "null"], format: date-time }
      required: [isOnline, lastSeenAt]
    ReadReceiptStatus:
      type: object
      properties:
        readAt: { type: [string, "null"], format: date-time }
      required: [readAt]
    ProfileView:
      type: object
      properties:
        profile: { $ref: "#/components/schemas/Profile" }
        viewedAt: { type: string, format: date-time }
      required: [profile, viewedAt]
    NotificationType:
      type: string
      enum: [new_match, new_message, new_like, profile_view]
    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/NotificationType" }
        actor: { $ref: "#/components/schemas/Profile" }
        matchId: { type: [string, "null"], format: uuid }
        messageId: { type: [string, "null"], format: uuid }
        createdAt: { type: string, format: date-time }
        readAt: { type: [string, "null"], format: date-time }
      required: [id, type, actor, createdAt, readAt]
    NotificationCounts:
      type: object
      properties:
        matches: { type: integer, minimum: 0 }
        messages: { type: integer, minimum: 0 }
        views: { type: integer, minimum: 0 }
        likes: { type: integer, minimum: 0 }
      required: [matches, messages, views, likes]
    NotificationsResponse:
      type: object
      properties:
        notifications:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
        unreadCounts: { $ref: "#/components/schemas/NotificationCounts" }
      required: [notifications, unreadCounts]
    BlockInput:
      type: object
      properties:
        targetUserId: { type: string, minLength: 1 }
      required: [targetUserId]
    ReportInput:
      type: object
      properties:
        targetUserId: { type: string, minLength: 1 }
        reason: { type: string, enum: [spam, fake, inappropriate, harassment, other] }
        details: { type: string, maxLength: 1000 }
      required: [targetUserId, reason]
    MediaUploadInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        size: { type: integer, minimum: 1, maximum: 524288000 }
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp, image/heic, video/mp4, video/quicktime, audio/mp4, audio/m4a, audio/aac, audio/wav]
        mediaType: { type: string, enum: [image, video, audio] }
      required: [name, size, contentType, mediaType]
    MediaUploadResult:
      type: object
      properties:
        uploadURL: { type: string, format: uri }
        mediaId: { type: string, format: uuid }
        mediaReference: { type: string }
      required: [uploadURL, mediaId, mediaReference]
    ProfileVideoTranscodeResult:
      type: object
      properties:
        mediaReference: { type: string }
        size: { type: integer, minimum: 1, maximum: 52428800 }
        duration: { type: number, exclusiveMinimum: 0, maximum: 30 }
        width: { type: integer, minimum: 1, maximum: 1280 }
        height: { type: integer, minimum: 1, maximum: 1280 }
      required: [mediaReference, size, duration, width, height]

