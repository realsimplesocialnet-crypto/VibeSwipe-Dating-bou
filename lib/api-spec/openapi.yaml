openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: VibeSwipe dating profile, discovery, matching, messaging, and safety API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: vibeswipe
    description: Authenticated dating app operations
security:
  - bearerAuth: []
paths:
  /vibeswipe/admin/session:
    get:
      operationId: getAdminSession
      tags: [vibeswipe]
      responses:
        "200":
          description: Verified administrator identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSession" }
  /vibeswipe/admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [vibeswipe]
      parameters:
        - { name: section, in: query, schema: { type: string, enum: [overview, users, chats, online, connections, user, chat], default: overview } }
        - { name: q, in: query, schema: { type: string, maxLength: 150 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 100000, default: 1 } }
        - { name: from, in: query, schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' } }
        - { name: to, in: query, schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' } }
        - { name: userId, in: query, schema: { type: string, maxLength: 150 } }
        - { name: chatId, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Paginated administration data. Dates use UTC and online means a heartbeat within 45 seconds.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDashboard" }
  /vibeswipe/admin/actions:
    post:
      operationId: adminModerationAction
      tags: [vibeswipe]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminModerationInput" }
      responses:
        "200":
          description: Action recorded and applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminActionResult" }
  /vibeswipe/admin/export:
    get:
      operationId: getAdminChatExport
      tags: [vibeswipe]
      parameters:
        - { name: chatId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: format, in: query, required: true, schema: { type: string, enum: [txt, json] } }
        - { name: from, in: query, schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' } }
        - { name: to, in: query, schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' } }
      responses:
        "200":
          description: Complete selected history, limited to 50000 messages with explicit rejection above that limit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminChatExport" }
  /vibeswipe/admin/media/{mediaId}:
    get:
      operationId: getAdminMedia
      tags: [vibeswipe]
      parameters:
        - { name: mediaId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Authorized private media; never publicly cached
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /vibeswipe/onboarding/draft:
    get:
      operationId: getOnboardingDraft
      tags: [vibeswipe]
      summary: Load the signed-in user's saved profile setup progress
      responses:
        "200":
          description: Saved setup progress or an empty draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingDraft"
    put:
      operationId: saveOnboardingDraft
      tags: [vibeswipe]
      summary: Save progress from one profile setup screen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingDraftInput"
      responses:
        "200":
          description: Saved profile setup progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingDraft"
    delete:
      operationId: clearOnboardingDraft
      tags: [vibeswipe]
      summary: Clear completed profile setup progress
      responses:
        "204":
          description: Setup progress cleared
  /vibeswipe/me:
    get:
      operationId: getMyProfile
      tags: [vibeswipe]
      summary: Get the signed-in user's profile
      responses:
        "200":
          description: Profile found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          description: Profile has not been created
    put:
      operationId: saveMyProfile
      tags: [vibeswipe]
      summary: Create or update the signed-in user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Saved profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          description: Invalid profile
  /vibeswipe/verification:
    get:
      operationId: getFaceVerificationStatus
      tags: [vibeswipe]
      summary: Get the signed-in member's face verification status
      responses:
        "200":
          description: Availability and current badge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FaceVerificationStatus"
        "401": { description: Sign in required }
        "404": { description: Complete your profile first }
  /vibeswipe/verification/sessions:
    post:
      operationId: startFaceVerification
      tags: [vibeswipe]
      summary: Consent to processing and start a short-lived, photo-bound verification session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FaceVerificationConsent"
      responses:
        "201":
          description: Capture a fresh camera selfie before the session expires
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FaceVerificationSession"
        "400": { description: Explicit consent and a main profile photo are required }
        "401": { description: Sign in required }
        "409": { description: Account is unavailable or already verified }
        "429": { description: Too many attempts; try again later }
        "503": { description: Verification is not configured }
  /vibeswipe/verification/sessions/{sessionId}:
    post:
      operationId: completeFaceVerification
      tags: [vibeswipe]
      summary: Submit a fresh camera JPEG for checks and administrator review; never grants a badge
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Camera checks passed and the selected photo is awaiting administrator approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FaceVerificationResult"
        "400": { description: A valid JPEG of up to 5 MiB is required }
        "401": { description: Sign in required }
        "409": { description: "Session is expired, already used, or the profile photo changed" }
        "413": { description: Selfie is too large }
        "422": { description: Liveness or face matching failed; take a new selfie }
        "503": { description: The verification service could not complete the check }
  /vibeswipe/admin/verification-requests:
    get:
      operationId: getAdminVerificationRequests
      tags: [vibeswipe-admin]
      summary: Administrator-only photo verification review queue
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: status, schema: { type: string, enum: [awaiting_review, approved, rejected, cancelled], default: awaiting_review } }
      responses:
        "200":
          description: Paginated verification requests with passed camera checks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FaceVerificationQueue"
        "401": { description: Sign in required }
        "403": { description: Administrator access required }
  /vibeswipe/admin/verification-requests/{requestId}/photo:
    get:
      operationId: getAdminVerificationPhoto
      tags: [vibeswipe-admin]
      summary: Privately view the exact photo submitted for approval
      parameters:
        - { in: path, name: requestId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Submitted photo; never a camera selfie
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "401": { description: Sign in required }
        "403": { description: Administrator access required }
        "404": { description: Photo unavailable }
  /vibeswipe/admin/verification-requests/{requestId}/decision:
    post:
      operationId: reviewFaceVerification
      tags: [vibeswipe-admin]
      summary: Explicit owner-admin approval promotes the checked photo and grants the badge
      parameters:
        - { in: path, name: requestId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FaceVerificationDecision" }
      responses:
        "200":
          description: Approved or rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FaceVerificationDecisionResult" }
        "400": { description: Invalid decision }
        "401": { description: Sign in required }
        "403": { description: Administrator access required }
        "404": { description: Request not found }
        "409": { description: Request already decided or profile changed }
  /vibeswipe/discover:
    get:
      operationId: getDiscoverProfiles
      tags: [vibeswipe]
      summary: Smart local-first discovery, expanding worldwide below the minimum local pool; explicit location filters remain strict
      parameters:
        - in: query
          name: ageMin
          schema: { type: integer, minimum: 18, maximum: 120 }
        - in: query
          name: ageMax
          schema: { type: integer, minimum: 18, maximum: 120 }
        - in: query
          name: gender
          schema: { type: string }
        - in: query
          name: city
          schema: { type: string }
        - in: query
          name: country
          schema: { type: string }
        - in: query
          name: state
          description: Exact state or region within the selected country.
          schema: { type: string }
        - in: query
          name: includePassed
          description: Include previously passed profiles in an explicit location search; likes, blocks, and privacy rules still apply.
          schema: { type: string, enum: ["true", "false"] }
      responses:
        "200":
          description: Profiles for discovery
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Profile" }
  /vibeswipe/reactions:
    post:
      operationId: createReaction
      tags: [vibeswipe]
      summary: Like, super-like, or pass on a profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReactionInput"
      responses:
        "200":
          description: Reaction recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReactionResult"
        "429":
          description: Daily Super Like limit reached
  /vibeswipe/reactions/undo:
    delete:
      operationId: undoLastPass
      tags: [vibeswipe]
      summary: Undo the signed-in user's most recent pass
      responses:
        "200":
          description: Result of the undo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UndoReactionResult"
  /vibeswipe/super-likes:
    get:
      operationId: getSuperLikeStatus
      tags: [vibeswipe]
      summary: Get today's remaining Super Likes
      responses:
        "200":
          description: Remaining Super Likes and next reset time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuperLikeStatus"
  /vibeswipe/likes/status:
    get:
      operationId: getDailyLikeStatus
      tags: [vibeswipe]
      summary: Get remaining free likes and the next reset time
      responses:
        "200":
          description: Daily like allowance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyLikeStatus"
  /vibeswipe/boost:
    get:
      operationId: getBoostStatus
      tags: [vibeswipe]
      summary: Get Boost activity and cooldown status
      responses:
        "200":
          description: Current Boost status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoostStatus"
    post:
      operationId: activateBoost
      tags: [vibeswipe]
      summary: Activate a 30-minute profile Boost
      responses:
        "200":
          description: Boost activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoostStatus"
        "409":
          description: Boost is active or still cooling down
  /vibeswipe/icebreakers:
    get:
      operationId: getIcebreakers
      tags: [vibeswipe]
      summary: List suggested first-message questions
      responses:
        "200":
          description: Active icebreaker questions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Icebreaker" }
  /vibeswipe/settings:
    get:
      operationId: getVibeSwipeSettings
      tags: [vibeswipe]
      summary: Get the signed-in user's privacy settings
      responses:
        "200":
          description: User privacy settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VibeSwipeSettings"
    put:
      operationId: updateVibeSwipeSettings
      tags: [vibeswipe]
      summary: Save the signed-in user's privacy settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VibeSwipeSettingsUpdateInput"
      responses:
        "200":
          description: Saved privacy settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VibeSwipeSettings"
        "404":
          description: Target profile not found
        "400":
          description: Travel city must be selected from real city suggestions
  /vibeswipe/travel-cities:
    get:
      operationId: searchTravelCities
      tags: [vibeswipe]
      summary: Search verified travel cities
      parameters:
        - name: search
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100
      responses:
        "200":
          description: Matching real cities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TravelCityOption"
  /vibeswipe/safety/emergency-contacts:
    get:
      operationId: listEmergencyContacts
      tags: [vibeswipe]
      summary: List the signed-in user's trusted emergency contacts
      responses:
        "200":
          description: Emergency contacts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EmergencyContact" }
    post:
      operationId: addEmergencyContact
      tags: [vibeswipe]
      summary: Add a trusted emergency contact
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmergencyContactInput" }
      responses:
        "201":
          description: Emergency contact added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmergencyContact" }
        "409":
          description: The user already has three emergency contacts
  /vibeswipe/safety/emergency-contacts/{contactId}:
    delete:
      operationId: deleteEmergencyContact
      tags: [vibeswipe]
      summary: Remove one of the signed-in user's emergency contacts
      parameters:
        - name: contactId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Emergency contact removed
        "404":
          description: Emergency contact not found
  /vibeswipe/safety/location-share:
    get:
      operationId: getMyLocationShare
      tags: [vibeswipe]
      summary: Get the signed-in user's active location share
      responses:
        "200":
          description: Active share status, or empty status when none is active
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocationShareStatus" }
    post:
      operationId: createLocationShare
      tags: [vibeswipe]
      summary: Start a one-hour location share
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocationShareCreateInput" }
      responses:
        "201":
          description: Location share created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocationShareCreateResult" }
  /vibeswipe/safety/location-share/{shareId}:
    patch:
      operationId: updateLocationShare
      tags: [vibeswipe]
      summary: Update coordinates for an active location share
      parameters:
        - name: shareId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocationShareUpdateInput" }
      responses:
        "200":
          description: Location updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocationShareUpdateResult" }
        "404":
          description: Active location share not found
    delete:
      operationId: stopLocationShare
      tags: [vibeswipe]
      summary: Stop an active location share
      parameters:
        - name: shareId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Location sharing stopped
        "404":
          description: Location share not found
  /vibeswipe/public/location-share:
    get:
      operationId: getPublicLocationShare
      tags: [vibeswipe]
      summary: Read the latest location from a temporary share link
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string, minLength: 40, maxLength: 60 }
      responses:
        "200":
          description: Current location and share expiry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicLocationShare" }
        "404":
          description: The share link is invalid, stopped, or expired
  /vibeswipe/matches:
    get:
      operationId: getMatches
      tags: [vibeswipe]
      summary: List current matches
      responses:
        "200":
          description: Matches for the signed-in user
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Match" }
  /vibeswipe/matches/{matchId}/messages:
    post:
      operationId: sendMessage
      tags: [vibeswipe]
      summary: Send a message in a match
      parameters:
        - in: path
          name: matchId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "403":
          description: Not a participant in the match
    get:
      operationId: getMessages
      tags: [vibeswipe]
      summary: Get messages for a match
      parameters:
        - in: path
          name: matchId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Match messages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Message" }
        "403":
          description: Not a participant in the match
  /vibeswipe/matches/{matchId}/messages/{messageId}:
    delete:
      operationId: deleteMessage
      tags: [vibeswipe]
      summary: Delete a message for the signed-in user or for everyone
      parameters:
        - in: path
          name: matchId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: messageId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteMessageInput"
      responses:
        "204":
          description: Message deleted
        "403":
          description: Not allowed to delete this message
  /vibeswipe/matches/{matchId}:
    delete:
      operationId: unmatchMatch
      tags: [vibeswipe]
      summary: Remove a match and its shared chat history
      parameters:
        - in: path
          name: matchId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Match removed for both participants
        "403":
          description: Not a participant in the match
  /vibeswipe/matches/{matchId}/messages/events:
    get:
      operationId: streamMatchMessages
      tags: [vibeswipe]
      summary: Stream new messages for a match
      description: Authenticated server-sent events stream. Reconnect with the most recent message ID in the Last-Event-ID header to recover missed messages.
      parameters:
        - in: path
          name: matchId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: Last-Event-ID
          required: false
          description: Most recently received message ID; messages after it are replayed on connection.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Server-sent message events
          content:
            text/event-stream:
              schema: { type: string }
        "403":
          description: Not a participant in the match
  /vibeswipe/matches/{matchId}/clear:
    post:
      operationId: clearChat
      tags: [vibeswipe]
      summary: Clear messages from the signed-in user's chat view
      parameters:
        - in: path
          name: matchId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Chat cleared for the signed-in user
        "403":
          description: Not a participant in the match
  /vibeswipe/matches/{matchId}/chat:
    delete:
      operationId: deleteChat
      tags: [vibeswipe]
      summary: Hide a conversation from the signed-in user's chat list
      parameters:
        - in: path
          name: matchId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Conversation hidden for the signed-in user
        "403":
          description: Not a participant in the match
  /vibeswipe/matches/{matchId}/typing:
    get:
      operationId: getTypingStatus
      tags: [vibeswipe]
      summary: Get the other participant's typing status
      parameters:
        - in: path
          name: matchId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Current typing status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypingStatus"
        "403":
          description: Not a participant in the match
    put:
      operationId: updateTypingStatus
      tags: [vibeswipe]
      summary: Update the signed-in user's temporary typing status
      parameters:
        - in: path
          name: matchId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TypingInput"
      responses:
        "204":
          description: Typing status updated
        "403":
          description: Chat is unavailable
  /vibeswipe/matches/{matchId}/theme:
    put:
      operationId: updateChatTheme
      tags: [vibeswipe]
      summary: Save the signed-in user's chat appearance for a match
      parameters:
        - in: path
          name: matchId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatThemeInput"
      responses:
        "200":
          description: Saved chat theme
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatThemeResult"
        "403":
          description: Chat is unavailable
  /vibeswipe/matches/{matchId}/uploads/request-url:
    post:
      operationId: requestChatMediaUpload
      tags: [vibeswipe]
      summary: Request a media upload URL for a matched chat
      parameters:
        - in: path
          name: matchId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaUploadInput"
      responses:
        "200":
          description: Private upload URL and media reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaUploadResult"
        "400":
          description: Invalid or oversized attachment
        "403":
          description: Chat is unavailable
  /vibeswipe/matches/{matchId}/presence:
    get:
      operationId: getMatchPresence
      tags: [vibeswipe]
      summary: Get the other participant's online and last-seen status
      parameters:
        - in: path
          name: matchId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Other participant's presence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresenceStatus"
        "403":
          description: Chat is unavailable
  /vibeswipe/matches/{matchId}/read:
    get:
      operationId: getChatReadReceipt
      tags: [vibeswipe]
      summary: Get when the other participant last read the chat
      parameters:
        - in: path
          name: matchId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Read receipt status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadReceiptStatus"
        "403":
          description: Chat is unavailable
    put:
      operationId: markChatRead
      tags: [vibeswipe]
      summary: Mark the chat read for the signed-in user
      parameters:
        - in: path
          name: matchId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Chat marked read
        "403":
          description: Chat is unavailable
  /vibeswipe/presence:
    put:
      operationId: heartbeatPresence
      tags: [vibeswipe]
      summary: Record that the signed-in user is active
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresenceHeartbeatInput"
      responses:
        "204":
          description: Presence updated
  /vibeswipe/profiles/{profileId}/views:
    post:
      operationId: recordProfileView
      tags: [vibeswipe]
      summary: Record that the signed-in user opened a profile
      parameters:
        - in: path
          name: profileId
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "204":
          description: Profile view recorded
        "404":
          description: Profile not found
  /vibeswipe/likes:
    get:
      operationId: getWhoLikedYou
      tags: [vibeswipe]
      summary: List current incoming likes for the signed-in user
      responses:
        "200":
          description: Real unblocked members who liked the signed-in user
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProfileLike" }
  /vibeswipe/views:
    get:
      operationId: getWhoViewedYou
      tags: [vibeswipe]
      summary: List people who opened the signed-in user's profile
      responses:
        "200":
          description: Profile viewers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProfileView" }
  /vibeswipe/notifications:
    get:
      operationId: getNotifications
      tags: [vibeswipe]
      summary: List saved in-app notifications and unread tab counts
      responses:
        "200":
          description: Notifications for the signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationsResponse"
  /vibeswipe/notifications/read:
    put:
      operationId: markNotificationsRead
      tags: [vibeswipe]
      summary: Mark a snapshot of the signed-in user's notifications as read
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationReadInput" }
      responses:
        "204":
          description: Notifications marked read without deleting activity
        "400":
          description: Invalid notification IDs
  /vibeswipe/notifications/{notificationId}/read:
    put:
      operationId: markNotificationRead
      tags: [vibeswipe]
      summary: Mark one notification as read
      parameters:
        - in: path
          name: notificationId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Notification marked read
        "404":
          description: Notification not found
  /vibeswipe/push/web/config:
    get:
      operationId: getWebPushConfig
      tags: [vibeswipe]
      summary: Get the public key needed to enable browser push notifications
      responses:
        "200":
          description: Web push configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebPushConfig"
  /vibeswipe/push/web/subscription:
    put:
      operationId: saveWebPushSubscription
      tags: [vibeswipe]
      summary: Save the signed-in user's browser push subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebPushSubscriptionInput"
      responses:
        "204":
          description: Browser push subscription saved
        "400":
          description: Invalid or unsupported push endpoint
    delete:
      operationId: deleteWebPushSubscription
      tags: [vibeswipe]
      summary: Remove the signed-in user's browser push subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebPushSubscriptionDeleteInput"
      responses:
        "204":
          description: Browser push subscription removed
  /vibeswipe/push/native-token:
    put:
      operationId: saveNativePushToken
      tags: [vibeswipe]
      summary: Save the signed-in user's Expo push token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NativePushTokenInput"
      responses:
        "204":
          description: Native push token saved
        "400":
          description: Invalid Expo push token
    delete:
      operationId: deleteNativePushToken
      tags: [vibeswipe]
      summary: Remove the signed-in user's Expo push token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NativePushTokenInput"
      responses:
        "204":
          description: Native push token removed
  /vibeswipe/profiles/{profileId}:
    get:
      operationId: getProfileById
      tags: [vibeswipe]
      summary: Get a profile opened from a notification
      parameters:
        - in: path
          name: profileId
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Profile details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "403":
          description: Profile is unavailable
        "404":
          description: Profile not found
  /vibeswipe/blocks:
    get:
      operationId: getBlockedProfiles
      tags: [vibeswipe]
      summary: List profiles blocked by the signed-in user
      responses:
        "200":
          description: Blocked profiles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BlockedProfile" }
    post:
      operationId: blockProfile
      tags: [vibeswipe]
      summary: Block a profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockInput"
      responses:
        "204":
          description: Profile blocked
  /vibeswipe/blocks/{targetUserId}:
    delete:
      operationId: unblockProfile
      tags: [vibeswipe]
      summary: Unblock a profile blocked by the signed-in user
      parameters:
        - in: path
          name: targetUserId
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "204":
          description: Profile unblocked
  /vibeswipe/reports:
    post:
      operationId: reportProfile
      tags: [vibeswipe]
      summary: Report a profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "201":
          description: Report submitted
  /vibeswipe/uploads/request-url:
    post:
      operationId: requestProfileMediaUpload
      tags: [vibeswipe]
      summary: Request a protected profile media upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaUploadInput"
      responses:
        "200":
          description: Upload URL and media reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaUploadResult"
        "400":
          description: Unsupported media or invalid file size
  /vibeswipe/uploads/{mediaId}/face-check:
    post:
      operationId: checkAdditionalProfilePhoto
      tags: [vibeswipe]
      summary: Check an uploaded photo against the verified main face before adding it
      parameters:
        - in: path
          name: mediaId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Allowed private media reference, sealed against later replacement when checked
          content:
            application/json:
              schema:
                type: object
                required: [mediaReference]
                properties:
                  mediaReference: { type: string }
        "422":
          description: Photo does not match the verified face or cannot be checked
        "503":
          description: Face checking unavailable; photo is not accepted
  /vibeswipe/uploads/{mediaId}/transcode:
    post:
      operationId: transcodeProfileVideo
      tags: [vibeswipe]
      summary: Compress an uploaded profile video for playback
      parameters:
        - in: path
          name: mediaId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Compressed video metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileVideoTranscodeResult"
        "400":
          description: Video exceeds supported duration or size limits
        "404":
          description: Uploaded video was not found
        "500":
          description: Video could not be processed
  /vibeswipe/media/{mediaId}:
    get:
      operationId: getProfileMedia
      tags: [vibeswipe]
      summary: Stream a media file referenced by a profile
      parameters:
        - in: path
          name: mediaId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Protected media content
          content:
            "*/*":
              schema: { type: string, format: binary }
        "403":
          description: Media is not visible to the signed-in user
        "404":
          description: Media not found
  /vibeswipe/stories:
    get:
      operationId: getStories
      tags: [vibeswipe]
      summary: List active stories from the signed-in user and mutual matches
      responses:
        "200":
          description: Active own and matched-user stories, ordered by newest story
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoriesFeed"
    post:
      operationId: createStory
      tags: [vibeswipe]
      summary: Post a story that expires after 24 hours
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoryInput"
      responses:
        "201":
          description: Story created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryCreated"
        "400":
          description: Invalid story or incomplete video upload
  /vibeswipe/stories/{storyId}:
    delete:
      operationId: deleteStory
      tags: [vibeswipe]
      summary: Delete the signed-in user's story
      parameters:
        - in: path
          name: storyId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Story deleted
        "404":
          description: Story not found
  /vibeswipe/stories/{storyId}/view:
    post:
      operationId: markStoryViewed
      tags: [vibeswipe]
      summary: Record that the signed-in user viewed an active matched story
      parameters:
        - in: path
          name: storyId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Story view recorded
        "403":
          description: Story is not visible to this user
        "404":
          description: Story expired or not found
  /vibeswipe/stories/uploads/request-url:
    post:
      operationId: requestStoryMediaUpload
      tags: [vibeswipe]
      summary: Request a private upload URL for a story photo or video
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaUploadInput"
      responses:
        "200":
          description: Private upload URL and media reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaUploadResult"
        "400":
          description: Unsupported or oversized story media
  /vibeswipe/stories/uploads/{mediaId}/transcode:
    post:
      operationId: transcodeStoryVideo
      tags: [vibeswipe]
      summary: Compress a story video and enforce the 15 second limit
      parameters:
        - in: path
          name: mediaId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Compressed video metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryVideoTranscodeResult"
        "400":
          description: Video exceeds story duration or size limits
        "404":
          description: Uploaded video was not found
  /vibeswipe/reels:
    get:
      operationId: getReelsFeed
      tags: [vibeswipe]
      summary: Page through public member Reels, newest first
      parameters:
        - in: query
          name: cursor
          required: false
          schema: { type: string, maxLength: 200 }
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 12 }
      responses:
        "200":
          description: One page of Reels
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReelPage" }
    post:
      operationId: createReel
      tags: [vibeswipe]
      summary: Publish a processed private video upload as a Reel
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReelInput" }
      responses:
        "201":
          description: Reel published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reel" }
        "400":
          description: Video not processed or invalid caption
        "403":
          description: Upload is not owned by this account
  /vibeswipe/reels/saved:
    get:
      operationId: getSavedReels
      tags: [vibeswipe]
      summary: Reels privately saved by the signed-in user
      parameters:
        - in: query
          name: cursor
          required: false
          schema: { type: string, maxLength: 200 }
      responses:
        "200":
          description: Saved Reels page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReelPage" }
  /vibeswipe/reels/mine:
    get:
      operationId: getMyReels
      tags: [vibeswipe]
      summary: Reels posted by the signed-in user
      parameters:
        - in: query
          name: cursor
          required: false
          schema: { type: string, maxLength: 200 }
      responses:
        "200":
          description: Posted Reels page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReelPage" }
  /vibeswipe/reels/{reelId}:
    get:
      operationId: getReel
      tags: [vibeswipe]
      summary: Open one visible Reel
      parameters:
        - { in: path, name: reelId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Reel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reel" }
        "404":
          description: Reel removed or unavailable
    delete:
      operationId: deleteReel
      tags: [vibeswipe]
      summary: Delete a Reel posted by the signed-in user
      parameters:
        - { in: path, name: reelId, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Reel deleted
        "404":
          description: Reel not found
  /vibeswipe/reels/{reelId}/like:
    put:
      operationId: likeReel
      tags: [vibeswipe]
      parameters:
        - { in: path, name: reelId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Updated engagement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReelEngagement" }
    delete:
      operationId: unlikeReel
      tags: [vibeswipe]
      parameters:
        - { in: path, name: reelId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Updated engagement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReelEngagement" }
  /vibeswipe/reels/{reelId}/save:
    put:
      operationId: saveReel
      tags: [vibeswipe]
      parameters:
        - { in: path, name: reelId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Updated engagement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReelEngagement" }
    delete:
      operationId: unsaveReel
      tags: [vibeswipe]
      parameters:
        - { in: path, name: reelId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Updated engagement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReelEngagement" }
  /vibeswipe/reels/{reelId}/comments:
    get:
      operationId: getReelComments
      tags: [vibeswipe]
      parameters:
        - { in: path, name: reelId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Newest comments, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ReelComment" }
    post:
      operationId: createReelComment
      tags: [vibeswipe]
      parameters:
        - { in: path, name: reelId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReelCommentInput" }
      responses:
        "201":
          description: Comment posted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReelComment" }
  /vibeswipe/reels/{reelId}/comments/{commentId}:
    delete:
      operationId: deleteReelComment
      tags: [vibeswipe]
      summary: Delete own comment, or any comment on own Reel
      parameters:
        - { in: path, name: reelId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: commentId, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Comment deleted
        "404":
          description: Comment not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    AdminSession:
      type: object
      required: [userId, name, email, timezone]
      properties:
        userId: { type: string }
        name: { type: string }
        email: { type: string }
        timezone: { type: string }
    AdminUser:
      type: object
      required: [id, name, age, city, state, country, gender, bio, occupation, interests, photos, verified, suspended, deactivated, online, connectionCount, joinedAt, lastSeenAt, username, phone, email]
      properties:
        id: { type: string }
        name: { type: string }
        age: { type: integer }
        city: { type: string }
        state: { type: [string, "null"] }
        country: { type: [string, "null"] }
        gender: { type: string }
        bio: { type: string }
        occupation: { type: string }
        interests: { type: array, items: { type: string } }
        photos: { type: array, items: { type: string } }
        verified: { type: boolean }
        suspended: { type: boolean }
        deactivated: { type: boolean }
        online: { type: boolean }
        connectionCount: { type: integer }
        joinedAt: { type: string }
        lastSeenAt: { type: [string, "null"] }
        username: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        email: { type: [string, "null"] }
    AdminChat:
      type: object
      required: [id, userAId, userBId, userAName, userBName, createdAt, lastMessageAt, messageCount, lastMessage]
      properties:
        id: { type: string }
        userAId: { type: string }
        userBId: { type: string }
        userAName: { type: string }
        userBName: { type: string }
        createdAt: { type: string }
        lastMessageAt: { type: [string, "null"] }
        messageCount: { type: integer }
        lastMessage: { type: [string, "null"] }
    AdminMessage:
      type: object
      required: [id, senderId, senderName, content, mediaReference, mediaType, deleted, createdAt]
      properties:
        id: { type: string }
        senderId: { type: string }
        senderName: { type: string }
        content: { type: string }
        mediaReference: { type: [string, "null"] }
        mediaType: { type: [string, "null"] }
        deleted: { type: boolean }
        createdAt: { type: string }
    AdminConnection:
      type: object
      required: [id, userAId, userBId, userAName, userBName, status, mutualCount, createdAt]
      properties:
        id: { type: string }
        userAId: { type: string }
        userBId: { type: string }
        userAName: { type: string }
        userBName: { type: string }
        status: { type: string, enum: [mutual, pending_like, pending_super_like] }
        mutualCount: { type: integer }
        createdAt: { type: string }
    AdminActivity:
      type: object
      required: [id, description, createdAt]
      properties:
        id: { type: string }
        description: { type: string }
        createdAt: { type: string }
    AdminStats:
      type: object
      required: [totalUsers, onlineUsers, activeChats, signupsToday, totalMatches, pendingLikes]
      properties:
        totalUsers: { type: integer }
        onlineUsers: { type: integer }
        activeChats: { type: integer }
        signupsToday: { type: integer }
        totalMatches: { type: integer }
        pendingLikes: { type: integer }
    AdminDashboard:
      type: object
      required: [section, page, pageSize, total, users, chats, messages, connections, activity, stats, selectedUser, selectedChat]
      properties:
        section: { type: string }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        users: { type: array, items: { $ref: "#/components/schemas/AdminUser" } }
        chats: { type: array, items: { $ref: "#/components/schemas/AdminChat" } }
        messages: { type: array, items: { $ref: "#/components/schemas/AdminMessage" } }
        connections: { type: array, items: { $ref: "#/components/schemas/AdminConnection" } }
        activity: { type: array, items: { $ref: "#/components/schemas/AdminActivity" } }
        stats: { $ref: "#/components/schemas/AdminStats" }
        selectedUser: { anyOf: [{ $ref: "#/components/schemas/AdminUser" }, { type: "null" }] }
        selectedChat: { anyOf: [{ $ref: "#/components/schemas/AdminChat" }, { type: "null" }] }
    AdminModerationInput:
      type: object
      required: [action, targetId]
      properties:
        action: { type: string, enum: [verify, unverify, block, unblock, delete_user, delete_chat, delete_message, remove_connection] }
        targetId: { type: string, minLength: 1, maxLength: 150 }
        confirmation: { type: string, maxLength: 30 }
    AdminActionResult:
      type: object
      required: [message]
      properties:
        message: { type: string }
    AdminChatExport:
      type: object
      required: [filename, content, mimeType]
      properties:
        filename: { type: string }
        content: { type: string }
        mimeType: { type: string }
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    DiscoveryLocationPreference:
      type: object
      properties:
        scope:
          type: string
          enum: [city, state, country, radius]
        country: { type: [string, "null"], maxLength: 100 }
        state: { type: [string, "null"], maxLength: 100 }
        city: { type: [string, "null"], maxLength: 100 }
        radiusKm: { type: [integer, "null"], minimum: 1, maximum: 500 }
      required: [scope, country, state, city, radiusKm]
    ProfilePreferences:
      type: object
      properties:
        ageMin: { type: integer, minimum: 18, maximum: 120 }
        ageMax: { type: integer, minimum: 18, maximum: 120 }
        gender: { type: string }
        distanceKm: { type: integer, minimum: 1, maximum: 500 }
        discoveryLocation:
          $ref: "#/components/schemas/DiscoveryLocationPreference"
      required: [ageMin, ageMax, gender, distanceKm]
    FaceVerificationConsent:
      type: object
      required: [consent, photoReference]
      properties:
        consent: { type: boolean }
        photoReference: { type: string, pattern: '^media:[0-9a-fA-F-]{36}$' }
    FaceVerificationStatus:
      type: object
