name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_DOMAIN: myage.beauty
      EXPO_PUBLIC_WEB_URL: https://myage.beauty

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.26.1 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Android build settings
        run: |
          if [ -z "$EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY" ]; then
            echo "Add EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY in GitHub repository Actions secrets."
            exit 1
          fi

      - name: Generate Android project
        run: >-
          pnpm --filter @workspace/vibeswipe exec expo prebuild
          --platform android
          --clean
          --non-interactive
          --no-install

      - name: Set Android SDK path
        run: |
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_PATH" ]; then
            echo "Android SDK was not found on the build runner."
            exit 1
          fi
          mkdir -p artifacts/vibeswipe/android
          echo "sdk.dir=$SDK_PATH" > artifacts/vibeswipe/android/local.properties

      - name: Build APK
        working-directory: artifacts/vibeswipe/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myage-android-apk
          path: artifacts/vibeswipe/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
